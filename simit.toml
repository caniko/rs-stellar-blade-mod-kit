[ci]
push_branches = ["trunk", "simit/update/**"]
provider = "actions"
platform = "github"
runtime = "nix"
runner = "ubuntu-24.04"
workspace = true
# self.submodules makes flake evals refetch the checkout by rev, which needs
# full history; the vendored bouldy crates live in a submodule.
extra_setup = ["git fetch --unshallow --quiet origin", "git submodule update --init vendor/bouldy"]
